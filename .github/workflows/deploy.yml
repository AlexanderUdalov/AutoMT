name: Deploy
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or exact SHA
        required: true
        default: master
      operation:
        description: Release operation
        type: choice
        options:
        - deploy
        - verify
        - status
        - rollback
        default: deploy
        required: true
      backup:
        description: Backup id, only for rollback
        required: false
permissions:
  contents: read
concurrency:
  group: automt-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
      if: ${{ inputs.operation == 'deploy' || inputs.operation == 'verify' }}
    - run: dotnet publish Sources/Backend/AutoMT.csproj -c Release -r linux-x64 --self-contained true -o .release/backend
      if: ${{ inputs.operation == 'deploy' || inputs.operation == 'verify' }}
    - run: 'mkdir -p .release/frontend

        cp -r Sources/Frontend/. .release/frontend/'
      if: ${{ inputs.operation == 'deploy' || inputs.operation == 'verify' }}
    - name: API smoke with isolated database
      shell: bash
      run: "set -euo pipefail\ncd .release/backend\nASPNETCORE_URLS=http://127.0.0.1:5297 ConnectionStrings__AutoMT=\"Data\
        \ Source=$RUNNER_TEMP/automt-check.db\" ./AutoMT > \"$RUNNER_TEMP/automt-check.log\" 2>&1 &\npid=$!\ntrap 'kill \"\
        $pid\" 2>/dev/null || true' EXIT\ncd ../..\nfor i in $(seq 1 30); do\n  if curl --fail --silent http://127.0.0.1:5297/api/health;\
        \ then break; fi\n  sleep 1\ndone\nnode --test Tests/api-smoke.mjs"
      if: ${{ inputs.operation == 'deploy' || inputs.operation == 'verify' }}
    - name: Package exact source revision
      shell: bash
      run: 'set -euo pipefail

        revision=$(git rev-parse HEAD)

        echo "RELEASE_SHA=$revision" >> "$GITHUB_ENV"

        python scripts/package_release.py --project automt --sha "$revision" --backend .release/backend --frontend .release/frontend
        --output release.tar.gz'
      if: ${{ inputs.operation == 'deploy' || inputs.operation == 'verify' }}
    - name: Restricted release operation
      env:
        DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        DEPLOY_HOST_KEY_ALIAS: ${{ vars.DEPLOY_HOST_KEY_ALIAS }}
        DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        OPERATION: ${{ inputs.operation }}
        BACKUP_ID: ${{ inputs.backup }}
      shell: bash
      run: "set -euo pipefail\ncase \"$OPERATION\" in\n  deploy|verify) python scripts/deploy_client.py \"$OPERATION\" --archive\
        \ release.tar.gz --sha \"$RELEASE_SHA\" ;;\n  status) python scripts/deploy_client.py status ;;\n  rollback) python\
        \ scripts/deploy_client.py rollback --backup \"$BACKUP_ID\" ;;\n  *) exit 1 ;;\nesac"
