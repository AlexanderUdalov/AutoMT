<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoMT — Управление аккаунтом</title>
    <style>
        [x-cloak] {
            display: none !important;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-scale {
            animation: scaleIn 0.3s ease-out forwards;
        }
    </style>
    <script type="module" src="./js/app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100"  x-data="account()" x-init="init()">
    <!-- Навигация -->
    <nav x-data="{ isOpen: false }" class="bg-white w-full z-20 top-0 start-0 border-b border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between md:justify-center mx-auto p-4 relative">
            <img src="./images/logo.png" class="h-14 md:absolute md:left-4" alt="Logo">
            <div class="flex md:order-2 space-x-3 md:space-x-0">
                <button @click="isOpen = !isOpen" type="button"
                    class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none">
                    <span class="sr-only">Toggle menu</span>
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div :class="{ 'hidden': !isOpen }"
                class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
                <ul
                    class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 md:flex-row md:mt-0 md:border-0 md:bg-white">
                    <li><a href="index.html" class="block py-2 px-3 text-gray-900 hover:text-red-600 md:p-0">Главная</a>
                    </li>
                    <li><a href="garage.html" class="block py-2 px-3 text-gray-900 hover:text-red-600 md:p-0">Гараж</a>
                    </li>
                    <li><a href="account.html" class="block py-2 px-3 text-red-600 md:p-0 font-semibold">Аккаунт</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="max-w-screen-md mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6" x-text="`Управление аккаунтом - ${username}`"></h1>

        <!-- Сменить username -->
        <section x-data="changeUsernameForm()" class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-2xl font-semibold mb-4">Сменить имя пользователя</h2>
            <form @submit.prevent="submit" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-1">Новое имя пользователя</label>
                    <input type="text" x-model="usernameInput"
                        :class="'w-full p-2 border rounded ' + (error ? 'border-red-500' : 'border-gray-300')"
                        required />
                    <p x-show="error" x-text="error" class="text-red-500 text-sm mt-1"></p>
                </div>
                <button type="submit"
                    class="mt-4 px-4 py-2 rounded transition flex items-center justify-center h-10 w-32"
                    :class="changed ? 'bg-green-600 text-white' : 'bg-red-600 text-white hover:bg-red-700'"
                    x-transition>
                    <template x-if="!changed">
                        <span>Сохранить</span>
                    </template>
                    <template x-if="changed">
                        <i class="fas fa-check text-white text-xl animate-scale"></i>
                    </template>
                </button>
            </form>
        </section>

        <!-- Сменить пароль -->
        <section x-data="changePasswordForm()" class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-2xl font-semibold mb-4">Сменить пароль</h2>
            <form @submit.prevent="submit" class="space-y-4">
                <div>
                    <label for="currentPassword" class="block text-gray-700">Текущий пароль</label>
                    <input type="password" id="currentPassword" x-model="currentPassword"
                        :class="'w-full p-2 border rounded ' + (currentError ? 'border-red-500' : 'border-gray-300')"
                        required />
                    <p x-show="currentError" x-text="currentError" class="text-red-500 text-sm mt-1"></p>
                </div>
                <div>
                    <label for="newPassword" class="block text-gray-700">Новый пароль</label>
                    <input type="password" id="newPassword" x-model="newPassword" required
                        class="w-full mt-1 p-2 border border-gray-300 rounded" />
                </div>
                <div>
                    <label for="retypePassword" class="block text-gray-700">Подтвердите новый пароль</label>
                    <input type="password" id="retypePassword" x-model="retypePassword"
                        :class="'w-full p-2 border rounded ' + (retypeError ? 'border-red-500' : 'border-gray-300')"
                        required />
                    <p x-show="retypeError" x-text="retypeError" class="text-red-500 text-sm mt-1"></p>
                    <p x-show="error" x-text="error" class="text-red-500 text-sm mt-1"></p>
                </div>
                <button type="submit"
                    class="mt-4 px-4 py-2 rounded transition flex items-center justify-center h-10 w-32"
                    :class="changed ? 'bg-green-600 text-white' : 'bg-red-600 text-white hover:bg-red-700'"
                    x-transition>
                    <template x-if="!changed">
                        <span>Сохранить</span>
                    </template>
                    <template x-if="changed">
                        <i class="fas fa-check text-white text-xl animate-scale"></i>
                    </template>
                </button>
            </form>
        </section>

        <!-- Выход из аккаунта -->
        <section class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-2xl font-semibold mb-4">Выход из аккаунта</h2>
            <form @submit.prevent="logout()">
                <button type="submit" class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 transition">
                    Выйти
                </button>
            </form>
        </section>

        <!-- Удаление аккаунта -->
        <section class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-2xl font-semibold mb-4 text-red-600">Удалить аккаунт</h2>
            <p class="mb-4 text-gray-700">После удаления ваш аккаунт и все данные будут безвозвратно удалены.</p>
            <button @click="openModal = true"
                class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">
                Удалить аккаунт
            </button>
        </section>
    </main>

    <!-- Модальное окно подтверждения -->
    <div x-cloak x-show="openModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div @click.away="openModal = false" class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-xl font-semibold mb-4">Подтвердите удаление</h3>
            <p class="mb-6 text-gray-700">Вы уверены, что хотите удалить свой аккаунт? Это действие необратимо.</p>
            <div class="flex justify-end space-x-4">
                <button @click="openModal = false" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 transition">
                    Отмена
                </button>
                <form @submit.prevent="deleteAccount">
                    <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">
                        Да, удалить
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
