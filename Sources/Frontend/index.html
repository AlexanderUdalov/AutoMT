<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoMT — Главная</title>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <script type="module" src="./js/app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>


<body class="bg-gray-100" x-data="index()" x-init="init()">
    <nav x-data="{ isOpen: false }" class="bg-white w-full z-20 top-0 start-0 border-b border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between md:justify-center mx-auto p-4 relative">
            <img src="./images/logo.png" class="h-14 md:absolute md:left-4" alt="Logo">

            <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button @click="isOpen = !isOpen" type="button"
                    class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M1 1h15M1 7h15M1 13h15" />
                    </svg>
                </button>
            </div>
            <div :class="{ 'hidden': !isOpen }"
                class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
                <ul
                    class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white">
                    <li>
                        <a href="#"
                            class="block py-2 px-3 text-white bg-red-700 rounded-sm md:bg-transparent md:text-red-700 md:p-0"
                            aria-current="page">Главная</a>
                        <!-- Выпадающий список авто: только в мобильной версии -->
                        <div class="block md:hidden mt-1 pl-3">
                            <template x-for="(car, index) in cars" :key="car.id">
                                <button @click="currentCarIndex = index initMaintenances()"
                                    class="block w-full text-left py-1 text-sm hover:text-red-600"
                                    :class="index === currentCarIndex? 'text-red-500' : 'text-gray-700 '">
                                    <span x-text="`- ${car.brand} ${car.model}`"></span>
                                </button>
                            </template>
                        </div>
                    </li>
                    <li>
                        <a href="./garage.html"
                            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-red-700 md:p-0">Гараж</a>
                    </li>
                    <li>
                        <a href="./account.html"
                            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-red-700 md:p-0">Аккаунт</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div x-show="!inited" class="flex items-center justify-center space-x-1 h-12" aria-label="Загрузка...">
        <i class="fas fa-circle text-gray-500 animate-bounce" style="animation-delay: 0s;"></i>
        <i class="fas fa-circle text-gray-500 animate-bounce" style="animation-delay: 0.2s;"></i>
        <i class="fas fa-circle text-gray-500 animate-bounce" style="animation-delay: 0.4s;"></i>
    </div>
    <div x-cloak x-show="inited">
        <div x-show="cars.length === 0" class="bg-white rounded-lg shadow p-6 text-center mb-6">
            <i class="fas fa-car text-4xl text-gray-300 mb-4"></i>
            <h2 class="text-xl font-semibold text-gray-700 mb-2">В вашем гараже пока нет машин</h2>
            <p class="text-gray-500 mb-4">Добавьте свою первую машину</p>
            <button @click="window.location.href = 'vehicleForm.html'"
                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md">
                <i class="fas fa-plus mr-2"></i>Добавить машину
            </button>
        </div>
        <div x-show="cars.length > 0" class="min-h-screen max-w-screen-md mx-auto">
            <div class="min-h-screen max-w-screen-md mx-auto">
                <div class="container mx-auto px-4 py-2">
                    <div class="mb-6">
                        <div class="hidden md:flex mb-4 space-x-2">
                            <template x-for="(car, index) in cars" :key="car.id">
                                <button @click="currentCarIndex = index; initMaintenances()"
                                    class="px-5 py-3 rounded-lg text-sm font-medium transition-all duration-200" :class="index === currentCarIndex
                    ? 'text-2xl font-bold bg-transparent text-gray-800 border-b-2 border-red-600'
                    : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
                                    <span x-text="`${car.brand} ${car.model}`"></span>
                                </button>
                            </template>
                        </div>

                        <div class="md:hidden">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h1 class="text-xl font-bold text-gray-800 mb-1"
                                        x-text="`${currentCar.brand} ${currentCar.model}`"></h1>
                                    <div class="flex items-center">
                                        <span class="text-sm text-gray-500 mr-2" x-text="currentCar.year"></span>
                                        <span class="text-sm text-gray-500">•</span>
                                        <span class="text-sm text-gray-500 ml-2"
                                            x-text="new Intl.NumberFormat('ru-RU').format(currentCar.mileage) + ' км'"></span>
                                        <button @click="updateMileage()" class="text-gray-400 hover:text-red-500 ml-2">
                                            <i class="fas fa-sync-alt text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <span class="text-sm text-gray-500">VIN: <span class="font-medium"
                                            x-text="currentCar.vin"></span></span>
                                    <button @click="copyToClipboard(currentCar.vin)"
                                        class="text-gray-400 hover:text-gray-600">
                                        <template x-if="!copied">
                                            <i
                                                class="far fa-copy text-lg transition-transform duration-200 ease-in-out transform hover:scale-110"></i>
                                        </template>
                                        <template x-if="copied">
                                            <i class="fas fa-check text-green-500 text-lg animate-bounce"></i>
                                        </template>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="hidden md:block">
                            <div class="flex items-end justify-between border-t-4 ">
                                <div>
                                    <div class="flex items-center mt-1">
                                        <span class="text-gray-500 text-base mr-3" x-text="currentCar.year"></span>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between pt-3">
                                    <div class="text-sm text-gray-500 mr-2">
                                        VIN: <span class="font-medium" x-text="currentCar.vin"></span>
                                    </div>
                                    <button @click="copyToClipboard(currentCar.vin)"
                                        class="text-gray-400 hover:text-gray-600">
                                        <template x-if="!copied">
                                            <i
                                                class="far fa-copy text-lg transition-transform duration-200 ease-in-out transform hover:scale-110"></i>
                                        </template>
                                        <template x-if="copied">
                                            <i class="fas fa-check text-green-500 text-lg animate-bounce"></i>
                                        </template>
                                    </button>
                                </div>

                                <div class="flex items-center">
                                    <h2 class="text-lg font-bold text-gray-800 mr-4"
                                        x-text="new Intl.NumberFormat('ru-RU').format(currentCar.mileage) + ' км'">
                                    </h2>
                                    <button @click="updateMileage()" class="text-gray-400 hover:text-red-500">
                                        <i class="fas fa-sync-alt text-md"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>


                    <div class="space-y-3 md:space-y-4">
                        <template x-for="(item, index) in sortedMaintenanceItems()" :key="item.id">
                            <div class="bg-white rounded-lg shadow overflow-hidden" :class="{
               'border-l-4 border-red-500': isOverdue(item),
               'border-l-4 border-yellow-400': isDueSoon(item) && !isOverdue(item)
             }">
                                <div class="p-3 flex items-center" @click="toggleExpand(item.id)">
                                    <div class="mr-3 text-red-500 text-xl">
                                        <i :class="getMaintenanceType(item.typeId).icon"></i>
                                    </div>

                                    <div class="flex-1 min-w-0">
                                        <h3 class="font-semibold text-gray-800"
                                            x-text="getMaintenanceType(item.typeId).name"></h3>

                                        <div class="mt-1">
                                            <div class="w-full bg-gray-200 rounded-full h-2">
                                                <div class="bg-red-500 h-2 rounded-full"
                                                    :style="`width: ${getProgress(item)}%`"></div>
                                            </div>
                                            <div class="text-xs text-gray-600 mt-1" x-text="getShortDueText(item)">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="ml-2 flex items-center space-x-2">
                                        <button @click.stop="toggleExpand(item.id)"
                                            class="text-gray-500 hover:text-blue-600 p-1">
                                            <i class="fas"
                                                :class="expandedItems.includes(item.id) ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                                        </button>
                                    </div>
                                </div>

                                <div x-show="expandedItems.includes(item.id)" class="px-3 pb-3">
                                    <div class="border-t border-gray-200 pt-3">
                                        <div class="flex justify-between text-sm text-gray-600 mb-3">
                                            <div>
                                                <span class="font-medium">Регламент:</span>
                                                <span x-text="getShortIntervalText(item.typeId)" class="ml-1"></span>
                                            </div>
                                            <div>
                                                <span class="font-medium">Выполнено на</span>
                                                <span x-text="getShortLastChangedText(item)"></span>
                                            </div>
                                        </div>

                                        <div x-data="{ showParts: false }">
                                            <div class="flex justify-between text-sm text-gray-600 mb-3">
                                                <div>
                                                    <button @click="showParts = !showParts"
                                                        class="flex items-center text-sm text-blue-600 mb-2">
                                                        <i class="fas fa-box-open mr-2"></i>
                                                        <span>Запчасти</span>
                                                        <i class="fas ml-2"
                                                            :class="showParts ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                                                    </button>
                                                </div>
                                                <div>
                                                    <button
                                                        @click="location.href = `./maintenanceForm.html?maintenanceId=${item.id}&vehicleId=${currentCar.id}`"
                                                        class="bg-red-500 rounded-lg flex items-center text-sm text-white">
                                                        <div class="flex items-center mt-2 mb-2 ml-4 mr-4">
                                                            <i class="fa-solid fa-check"></i>
                                                            <span class="hidden md:block ml-2 mr-2">Отметить
                                                                выполненным</span>
                                                        </div>
                                                    </button>
                                                </div>
                                            </div>
                                            <div x-show="showParts" class="border-t border-gray-200 bg-gray-50 rounded p-2">
                                                <template
                                                    x-if="getMaintenanceType(item.typeId).parts && getMaintenanceType(item.typeId).parts.length > 0">
                                                    <template x-for="part in getMaintenanceType(item.typeId).parts"
                                                        :key="part.id">
                                                        <div class="mb-2 last:mb-0 text-sm">
                                                            <div class="font-medium" x-text="part.name"></div>
                                                            <!-- <div class="text-gray-600"
                                                            x-text="`Артикул: ${part.code || 'нет'}`"></div>
                                                        <div class="text-gray-600"
                                                            x-text="`Кол-во: ${part.quantity || 1}`"></div> -->
                                                        </div>
                                                    </template>
                                                </template>
                                                <template
                                                    x-if="!getMaintenanceType(item.typeId).parts || getMaintenanceType(item.typeId).parts.length === 0">
                                                    <div class="text-sm text-gray-500">Нет запчастей</div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- <div
                        class="bg-white rounded-lg shadow border-2 border-dashed border-gray-300 hover:border-red-400 transition-colors mt-4">
                        <button @click="addMaintenanceItem()"
                            class="w-full p-3 md:p-4 flex justify-center items-center">
                            <i class="fas fa-plus-circle text-xl md:text-2xl text-red-500 mr-2 md:mr-3"></i>
                            <p class="text-base md:text-lg font-medium text-gray-700">Добавить работу по ТО</p>
                        </button>
                    </div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
