<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoMT — Регистрация</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
  <script type="module" src="./js/app.js"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-10 rounded-2xl shadow-md w-full max-w-sm" x-data="registerForm()">
    <img src="./images/logo.png" alt="">
    <h2 class="text-2xl font-bold mb-4 text-center">Регистрация</h2>

    <form @submit.prevent="register">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Имя пользователя</label>
        <input type="text" class="w-full border rounded-lg p-2" x-model="username" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" class="w-full border rounded-lg p-2" x-model="email">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Пароль</label>
        <input type="password" class="w-full border rounded-lg p-2" x-model="password" required>
      </div>
      <template x-if="error">
        <div class="mb-4 text-red-500 text-sm" x-text="error"></div>
      </template>
      <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-xl w-full hover:bg-red-600">
        Зарегистрироваться
      </button>
      <p class="text-sm mt-4 text-center">
        Уже есть аккаунт? <a href="login.html" class="text-blue-600 hover:underline">Войти</a>
      </p>
    </form>
  </div>
</body>

</html>
