<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoMT — Гараж</title>
  <script type="module" src="./js/app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>


<body class="bg-gray-100">
  <nav x-data="{ isOpen: false }" class="bg-white w-full z-20 top-0 start-0 border-b border-gray-200">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between md:justify-center mx-auto p-4 relative">
      <img src="./images/logo.png" class="h-14 md:absolute md:left-4" alt="Logo">

      <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
        <button @click="isOpen = !isOpen" type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">
          <span class="sr-only">Open main menu</span>
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M1 1h15M1 7h15M1 13h15" />
          </svg>
        </button>
      </div>
      <div :class="{ 'hidden': !isOpen }" class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
        <ul
          class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white">
          <li>
            <a href="./index.html"
              class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-red-700 md:p-0">Главная</a>
          </li>
          <li>
            <a href="#"
              class="block py-2 px-3 text-white bg-red-700 rounded-sm md:bg-transparent md:text-red-700 md:p-0"
              aria-current="page">Гараж</a>
          </li>
          <li>
            <a href="./account.html"
              class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-red-700 md:p-0">Аккаунт</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="min-h-screen max-w-screen-md mx-auto" x-data="garage()" x-init="init()">
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-8">Мой гараж</h1>

      <div x-show="cars.length === 0" class="bg-white rounded-lg shadow p-6 text-center mb-6">
        <i class="fas fa-car text-4xl text-gray-300 mb-4"></i>
        <h2 class="text-xl font-semibold text-gray-700 mb-2">В вашем гараже пока нет машин</h2>
        <p class="text-gray-500 mb-4">Добавьте свою первую машину</p>
        <button @click="window.location.href = 'vehicleForm.html'"
          class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md">
          <i class="fas fa-plus mr-2"></i>Добавить машину
        </button>
      </div>

      <div x-show="cars.length > 0" class="space-y-4">
        <template x-for="car in cars" :key="car.id">
          <div class="bg-white rounded-lg shadow overflow-hidden">
            <!-- Мобильная версия (изображение сверху) -->
            <div class="md:hidden">
              <div class="w-full">
                <img src="images/car_stub.png" alt="" class="w-full h-68 object-cover">
              </div>

              <div class="p-4">
                <div class="flex justify-between items-start mb-3">
                  <div>
                    <h3 class="text-lg font-semibold text-gray-800" x-text="`${car.brand} ${car.model}`"></h3>
                    <div class="flex items-center text-gray-600 mt-1">
                      <span x-text="`${car.currentMileage} км`" class="mr-2"></span>
                      <button @click="updateMileage(car.id)" class="text-gray-400 hover:text-blue-500">
                        <i class="fas fa-sync-alt text-xs"></i>
                      </button>
                    </div>
                    <p class="text-gray-600 mt-1" x-text="car.year"></p>
                  </div>

                  <div class="flex space-x-3">
                    <button @click="window.location.href = `vehicleForm.html?id=${car.id}`"
                      class="text-gray-500 hover:text-blue-600">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button @click="deleteCar(car.id)" class="text-gray-500 hover:text-red-600">
                      <i class="fas fa-trash-alt"></i>
                    </button>
                  </div>
                </div>

                <div class="flex items-center justify-between pt-3 border-t border-gray-200">
                  <span class="text-sm text-gray-500">VIN:</span>
                  <div class="flex items-center">
                    <span class="font-medium mr-2" x-text="car.vin"></span>
                    <div class="relative inline-block">
                      <button @click="copyToClipboard(car.vin)" class="text-gray-400 hover:text-gray-600">
                        <template x-if="!copied">
                          <i
                            class="far fa-copy text-lg transition-transform duration-200 ease-in-out transform hover:scale-110"></i>
                        </template>
                        <template x-if="copied">
                          <i class="fas fa-check text-green-500 text-lg animate-bounce"></i>
                        </template>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Десктопная версия (изображение слева, контент справа) -->
            <div class="hidden md:flex">
              <div class="w-1/3 min-w-[200px]">
                <img src="images/car_stub.png" alt="Фото автомобиля" class="w-full h-full object-cover">
              </div>

              <div class="flex-1 p-4">
                <div class="flex justify-center">
                  <!-- Первая колонка -->
                  <div class="w-full pr-4">
                    <h3 class="text-lg font-semibold text-gray-800" x-text="`${car.brand} ${car.model}`"></h3>
                    <div class="flex items-center text-gray-600 mt-2">
                      <span x-text="`${car.currentMileage} км`" class="mr-2"></span>
                      <button @click="updateMileage(car.id)" class="text-gray-400 hover:text-red-500">
                        <i class="fas fa-sync-alt text-sm"></i>
                      </button>
                    </div>
                    <p class="text-gray-400 text-sm mt-2" x-text="car.year"></p>
                  </div>

                  <!-- Вторая колонка -->
                  <div class="w-2/3 flex flex-col items-end">
                    <div class=" justify-between flex flex-col items-end">
                      <div class="flex mb-9 space-x-3">
                        <button @click="window.location.href = `vehicleForm.html?id=${car.id}`"
                          class="text-gray-500 hover:text-blue-600">
                          <i class="fas fa-edit"></i>
                        </button>
                        <button @click="deleteCar(car.id)" class="text-gray-500 hover:text-red-600">
                          <i class="fas fa-trash-alt"></i>
                        </button>
                      </div>
                      <div class="flex items-center">
                        <span class="text-sm text-gray-500 mr-2">VIN:</span>
                        <span class="font-medium mr-2" x-text="car.vin"></span>
                        <button @click="copyToClipboard(car.vin)" class="text-gray-400 hover:text-gray-600">
                          <template x-if="!copied">
                            <i
                              class="far fa-copy text-lg transition-transform duration-200 ease-in-out transform hover:scale-110"></i>
                          </template>
                          <template x-if="copied">
                            <i class="fas fa-check text-green-500 text-lg animate-bounce"></i>
                          </template>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
        <div
          class="bg-white rounded-lg shadow border-2 border-dashed border-gray-300 hover:border-red-400 transition-colors">
          <button @click="window.location.href = 'vehicleForm.html'" class="w-full p-2 flex justify-center">
            <i class="fas fa-plus-circle text-3xl text-red-500 m-2"></i>
            <p class="text-lg font-medium text-gray-700 m-2">Добавить новую машину</p>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
