<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoMT — Техническое обслуживание</title>
    <script type="module" src="./js/app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100">
    <nav x-data="{ isOpen: false }" class="bg-white w-full z-20 top-0 start-0 border-b border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between md:justify-center mx-auto p-4 relative">
            <img src="./images/logo.png" class="h-14 md:absolute md:left-4" alt="Logo">

            <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button @click="isOpen = !isOpen" type="button"
                    class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M1 1h15M1 7h15M1 13h15" />
                    </svg>
                </button>
            </div>
            <div :class="{ 'hidden': !isOpen }"
                class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
                <ul
                    class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white">
                    <li>
                        <a href="./index.html"
                            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-red-700 md:p-0">Главная</a>
                    </li>
                    <li>
                        <a href="./garage.html"
                            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-red-700 md:p-0">Гараж</a>
                    </li>
                    <li>
                        <a href="./account.html"
                            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-red-700 md:p-0">Аккаунт</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="min-h-screen max-w-screen-md mx-auto" x-data="maintenanceForm()" x-init="init()">
        <div class="container mx-auto px-4 py-8">
            <div x-show="!inited" class="flex items-center justify-center space-x-1 h-12" aria-label="Загрузка...">
                <i class="fas fa-circle text-gray-500 animate-bounce" style="animation-delay: 0s;"></i>
                <i class="fas fa-circle text-gray-500 animate-bounce" style="animation-delay: 0.2s;"></i>
                <i class="fas fa-circle text-gray-500 animate-bounce" style="animation-delay: 0.4s;"></i>
            </div>
            <div x-cloak x-show="inited">
                <div class="flex items-center mb-6">
                    <a href="./index.html" class="text-red-600 hover:text-red-800 mr-2">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <h3 class="text-3xl font-bold text-gray-800"
                        x-text="getVehicleName() + ' — ' + getMaintenanceName()">
                    </h3>
                </div>

                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <form @submit.prevent="submitForm()">
                        <!-- Пробег -->
                        <div class="mb-6">
                            <label for="mileage" class="block text-sm font-medium text-gray-700 mb-1">Пробег
                                (км)</label>
                            <input type="number" id="mileage" x-model="currentVehicle.mileage"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                                required>
                        </div>

                        <!-- Список запчастей -->
                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-lg font-medium text-gray-700">Запчасти</h3>
                                <button type="button" @click="addPart()" class="text-red-600 hover:text-red-800"
                                    :disabled="availablePartTypes.length === 0">
                                    <i class="fas fa-plus"></i> Добавить запчасть
                                </button>
                            </div>

                            <div class="space-y-4">
                                <template x-for="(part, index) in parts" :key="index">
                                    <div class="border border-gray-200 rounded-md p-4">
                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
                                            <div>
                                                <label class="block text-sm font-medium text-gray-700 mb-1">Тип</label>
                                                <select x-model="part.type" @change="updateAvailablePartTypes()"
                                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                                                    required>
                                                    <option value="">Выберите тип</option>
                                                    <template x-for="partType in getAvailablePartTypesForSelect(index)">
                                                        <option :value="partType.name" x-text="partType.name"></option>
                                                    </template>
                                                </select>
                                            </div>
                                            <div>
                                                <label
                                                    class="block text-sm font-medium text-gray-700 mb-1">Бренд</label>
                                                <input type="text" x-model="part.brand"
                                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                                                    required>
                                            </div>
                                            <div>
                                                <label
                                                    class="block text-sm font-medium text-gray-700 mb-1">Артикул</label>
                                                <input type="text" x-model="part.code"
                                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500">
                                            </div>
                                        </div>
                                        <button type="button" @click="removePart(index)"
                                            class="text-red-600 hover:text-red-800 text-sm">
                                            <i class="fas fa-trash"></i> Удалить
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Кнопки -->
                        <div class="flex justify-end space-x-4">
                            <a href="./index.html"
                                class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                                Отмена
                            </a>
                            <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
                                Сохранить ТО
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
